[package]
name = "blog-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "blog-cli"
path = "src/main.rs"

[dependencies]
blog-client = { path = "../blog-client" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
directories = "5"
