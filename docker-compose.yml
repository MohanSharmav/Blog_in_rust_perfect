services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    volumes:
      - blog-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        DB_BACKEND: postgres
    environment:
      DATABASE_URL: postgres://blog:blog@db:5432/blog
      MAGIC_KEY: change-me-in-production
      RUST_LOG: info
      BIND_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  blog-db-data:
