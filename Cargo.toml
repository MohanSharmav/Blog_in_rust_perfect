[workspace]
members = ["blog-client", "blog-cli", "blog-core", "blog-storage", "blog-tests", "blog-views"]

[package]
name = "blog-server"
version = "0.1.0"
edition = "2021"

[features]
default = ["postgres"]
cors_for_local_development = []
# Exactly one of these must be enabled — see the compile_error! guard in
# main.rs. Each just forwards to the matching blog-storage backend.
postgres = ["blog-storage/postgres"]
sqlite = ["blog-storage/sqlite"]

[dependencies]
blog-core = { path = "blog-core" }
blog-storage = { path = "blog-storage", default-features = false }
blog-views = { path = "blog-views" }
dotenv = "0.15.0"
actix-web = "4"
actix-files = "0.6.2"
handlebars = {version="4.3.7" , features=["dir_source"]}
actix-identity = "0.5"
actix-session = { version = "0.7", features = [ "cookie-session" ] }
serde = "1.0"
anyhow = "1.0"
serde_json = "1.0.96"
actix-http = "3.3.1"
magic-crypt ="3.1.9"
env_logger = "0.10.0"
actix-web-flash-messages = {version="0.4.2",features=["cookies","sessions"]}
validator = { version = "0.16", features = ["derive"] }
utoipa = "4"
utoipa-swagger-ui = { version = "6", features = ["actix-web"] }
